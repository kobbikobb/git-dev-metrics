<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly PR work mix</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f1117; color: #e1e4ed; }
body { max-width: 1200px; margin: auto; padding: 1.5rem; }
h1 { margin-bottom: .2rem; } h2 { font-size: 1rem; }
p, small { color: #b2b7c7; }
section { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
.plot { position: relative; height: 360px; }
</style>
</head>
<body>
<h1>Monthly PR work mix</h1>
<p>{{ months[0] }} through {{ months[-1] }} · {{ scope }} · Model-estimated categories</p>
<small>An asterisk marks incomplete sync coverage. A gap means no selected repository was synced for that month.</small>
<section>
  <h2>Merged PRs</h2>
  <div class="plot"><canvas id="counts" aria-label="Monthly merged PR counts by category" role="img"></canvas></div>
</section>
<script>
const months = {{ months | tojson }};
const mix = {{ mix | tojson }};
const categories = [
  ['feature', 'Feature', '#79adff'], ['bug_fix', 'Bug fix', '#ff9a77'],
  ['maintenance', 'Maintenance', '#65d3b4'], ['unclear', 'Unclear', '#c2a4f6'],
  ['unclassified', 'Unclassified', '#b4b7c3']
];
Chart.defaults.color = '#b2b7c7';
const series = months.map(month => mix[month]);
const labels = months.map((month, i) => month + (series[i]?.partial ? ' *' : ''));
const datasets = categories.filter(([key]) =>
  !['unclear', 'unclassified'].includes(key) || series.some(row => row?.counts[key]))
  .map(([key, label, color]) => ({
    label, borderColor: color, backgroundColor: color, borderWidth: 2,
    data: series.map(row => row ? (row.counts[key] || 0) : null)
  }));
new Chart(document.getElementById('counts'), {type: 'line', data: {labels, datasets}, options: {
  responsive: true, maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
  scales: {y: {beginAtZero: true, ticks: {precision: 0}}}
}});
</script>
</body>
</html>
